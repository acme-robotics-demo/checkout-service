<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme Robotics — Checkout</title>
<style>
body{margin:0;background:#0e1424;color:#f4efe6;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{background:#151d32;border:1px solid #2a3555;border-radius:16px;padding:28px 32px;width:min(440px,90vw)}
h1{font-size:22px;margin:0 0 4px}.sub{color:#aab3c7;margin:0 0 20px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a3555}
.total{font-weight:700;font-size:20px;border:0;padding-top:16px}.tag{color:#e4a63c}
</style></head>
<body><div class="card"><h1>Acme Robotics</h1><p class="sub">Your cart</p><div id="rows"></div></div>
<script>
fetch('/api/cart').then(r => r.json()).then(c => {
  const rows = c.items.map(i => `<div class="row"><span>${i.quantity} × ${i.name}</span><span>$${(i.unitPriceCents*i.quantity/100).toFixed(2)}</span></div>`)
  rows.push(`<div class="row"><span>Subtotal</span><span>${c.subtotal}</span></div>`)
  rows.push(`<div class="row"><span>Discount <span class="tag">${c.discount.code}</span></span><span>−${c.discount.percent}%</span></div>`)
  rows.push(`<div class="row total"><span>Total</span><span>${c.total}</span></div>`)
  document.getElementById('rows').innerHTML = rows.join('')
})
</script></body></html>
